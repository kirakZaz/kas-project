<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>RGP204_KAS_Project_2026</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-container { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Canvas fills its container responsively — fits any itch.io / site viewport. */
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
      #unity-progress-bar-empty { width: 220px; height: 12px; background: #2a2a2a; border-radius: 6px; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #c4a44a; transition: width .1s; }
      #unity-fullscreen-button { position: absolute; right: 12px; bottom: 12px; width: 34px; height: 34px;
        background: rgba(0,0,0,.55); border-radius: 6px; cursor: pointer; }
      #unity-fullscreen-button:hover { background: rgba(0,0,0,.8); }
      #unity-warning { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 10; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style = (type == 'error')
          ? 'background: red; color:#fff; padding: 10px;'
          : 'background: yellow; color:#000; padding: 10px;';
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 5000);
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build.data.unityweb",
        frameworkUrl: buildUrl + "/build.framework.js.unityweb",
        codeUrl: buildUrl + "/build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "RGP204_KAS_Project_2026",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = buildUrl + "/build.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
